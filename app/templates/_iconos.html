{# Íconos SVG de línea. Uso: {% from "_iconos.html" import icono %} y luego {{ icono("usuarios") }} #}
{% macro icono(nombre) %}
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if nombre == "usuarios" %}
    <circle cx="9" cy="8" r="3.5"/>
    <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/>
    <path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/>
    <path d="M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/>
  {% elif nombre == "usuario-nuevo" %}
    <circle cx="10" cy="8" r="3.5"/>
    <path d="M3.5 20c0-3.6 2.9-6 6.5-6 1.5 0 2.9.4 4 1.2"/>
    <path d="M19 14v6M16 17h6"/>
  {% elif nombre == "importar" %}
    <path d="M12 3v12"/>
    <path d="m7.5 10.5 4.5 4.5 4.5-4.5"/>
    <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
  {% elif nombre == "escudo" %}
    <path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6L12 3Z"/>
    <path d="m9 12 2 2 4-4"/>
  {% elif nombre == "candado" %}
    <rect x="5" y="11" width="14" height="9" rx="2"/>
    <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
  {% elif nombre == "buscar" %}
    <circle cx="11" cy="11" r="6.5"/>
    <path d="m20 20-4.4-4.4"/>
  {% elif nombre == "volver" %}
    <path d="M19 12H5M11 6l-6 6 6 6"/>
  {% elif nombre == "flecha" %}
    <path d="M5 12h14M13 6l6 6-6 6"/>
  {% endif %}
</svg>
{% endmacro %}
